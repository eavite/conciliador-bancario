<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 650" role="img" aria-labelledby="title desc"><title id="title">Demo de conciliación bancaria</title><desc id="desc">Muestra ficticia de Banco A: 3 pagos conciliados y 4 partidas por revisar.</desc><rect width="1360" height="650" rx="18" fill="#0c1828"/><g font-family="Arial,sans-serif"><text x="64" y="65" font-size="17" letter-spacing="3" fill="#51c6a0">DEMO PÚBLICA · DATOS FICTICIOS</text><text x="64" y="141" fill="#e5ecf4" font-size="43">Pagos conciliados. Diferencias a la vista.</text><text x="64" y="185" fill="#8ea4bc" font-size="20">Banco A · Cierre ficticio · 15 abr 2030</text><g transform="translate(64,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">3</text><text x="24" y="117" fill="#acbdce" font-size="18">Conciliados</text></g><g transform="translate(374,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">1</text><text x="24" y="117" fill="#acbdce" font-size="18">Diferencia de importe</text></g><g transform="translate(684,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">2</text><text x="24" y="117" fill="#acbdce" font-size="18">Solo en sistema</text></g><g transform="translate(994,230)"><rect width="290" height="155" rx="10" fill="#132438" stroke="#263d53"/><text x="24" y="72" fill="#51c6a0" font-size="44">1</text><text x="24" y="117" fill="#acbdce" font-size="18">Solo en banco</text></g><path d="M64 438H1296" stroke="#263d53"/><text x="64" y="491" fill="#e5ecf4" font-size="23">Dos reportes → Comparar pagos → Revisar diferencias</text><text x="64" y="547" fill="#8ea4bc" font-size="19">Cliente + referencia · Horarios de corte · Copias de las fuentes</text><text x="64" y="601" fill="#51c6a0" font-size="17">EDUARDO VITE LEÓN</text></g></svg>